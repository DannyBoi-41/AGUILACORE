<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AGUILACORE Trading Platform</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #07111f;
    color: #f5c84c;
    font-family: Arial, Helvetica, sans-serif;
}

.header {
    background: #0b1728;
    border-bottom: 1px solid #c9a227;
    padding: 20px 25px;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    letter-spacing: 2px;
}

.subtitle {
    color: #9ba9bb;
    font-size: 12px;
    margin-top: 5px;
    letter-spacing: 1px;
}

.container {
    padding: 20px;
}

.market-bar {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 15px;
}

.market-label {
    color: #9ba9bb;
    font-size: 13px;
    font-weight: bold;
}

.market-name {
    color: #ffffff;
    font-size: 18px;
    font-weight: bold;
}

.chart-box {
    width: 100%;
    height: 650px;
    background: #0b1728;
    border: 1px solid #27384e;
}

.footer {
    text-align: center;
    color: #64748b;
    font-size: 11px;
    padding: 15px;
}
</style>

</head>

<body>

<div class="header">

    <div class="logo">
        AGUILACORE
    </div>

    <div class="subtitle">
        TRADING PLATFORM
    </div>

</div>


<div class="container">

    <div class="market-bar">

        <span class="market-label">
            MARKET
        </span>

        <span class="market-name">
            EURUSD
        </span>

    </div>


    <div class="chart-box">

        <div
            class="tradingview-widget-container"
            style="height:100%;width:100%"
        >

            <div
                class="tradingview-widget-container__widget"
                style="height:100%;width:100%"
            ></div>

            <div class="tradingview-widget-copyright">
                <a
                    href="https://www.tradingview.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    TradingView
                </a>
            </div>

            <script
                type="text/javascript"
                src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js"
                async
            >
            {
                "autosize": true,
                "symbol": "FX:EURUSD",
                "interval": "15",
                "timezone": "Asia/Manila",
                "theme": "dark",
                "style": "1",
                "locale": "en",
                "allow_symbol_change": false,
                "calendar": false,
                "support_host": "https://www.tradingview.com"
            }
            </script>

        </div>

    </div>

</div>


<div class="footer">
    AGUILACORE Trading Platform © 2026
</div>

</body>
</html>
